name: Sausage Store Deploy

on:
  push:
    branches:
      - main

env:
  NEXUS_HELM_REPO: ${{ secrets.NEXUS_HELM_REPO }}
  NEXUS_HELM_REPO_USER: ${{ secrets.NEXUS_HELM_REPO_USER }}
  NEXUS_HELM_REPO_PASSWORD: ${{ secrets.NEXUS_HELM_REPO_PASSWORD }}
  SAUSAGE_STORE_NAMESPACE: r-devops-magistracy-project-2sem-233043853
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

jobs:
  # Сборка и пуш образов в докерхаб:
  build_and_push_to_docker_hub:
      name: Push Docker image to DockerHub
      runs-on: ubuntu-latest
      steps:
        - name: Check out the repo
          # Получение исходного кода из репозитория:
          uses: actions/checkout@v6

        - name: Set up Docker Buildx
          # Установка сборщика контейнеров Docker:
          uses: docker/setup-buildx-action@v4

        - name: Проверка миграций PostgreSQL
          run: |
            docker run --detach --name postgresql-migrations \
              --env POSTGRES_DB=sausage-store \
              --env POSTGRES_USER=store \
              --env POSTGRES_PASSWORD=migration-test \
              postgres:14
            trap 'docker rm --force postgresql-migrations >/dev/null' EXIT

            flyway=(docker run --rm --network container:postgresql-migrations
              --volume "$GITHUB_WORKSPACE/backend/src/main/resources/db/migration:/flyway/sql:ro"
              flyway/flyway:8.0.5
              -url=jdbc:postgresql://localhost:5432/sausage-store
              -user=store -password=migration-test -connectRetries=30)
            "${flyway[@]}" migrate
            "${flyway[@]}" migrate
            "${flyway[@]}" validate

            docker exec --interactive postgresql-migrations \
              psql --username=store --dbname=sausage-store --set=ON_ERROR_STOP=1 <<'SQL'
            BEGIN;
            DO $$
            DECLARE
              new_order_id BIGINT;
            BEGIN
              IF (SELECT COUNT(*) FROM product) <> 6
                OR (SELECT COUNT(*) FROM orders) <> 10000
                OR (SELECT COUNT(*) FROM order_product) <> 10000 THEN
                RAISE EXCEPTION 'Неверное количество начальных данных';
              END IF;
              IF (SELECT COUNT(*) FROM flyway_schema_history WHERE success) <> 4 THEN
                RAISE EXCEPTION 'Применены не все четыре миграции';
              END IF;
              INSERT INTO orders (status, date_created)
                VALUES ('PAID', CURRENT_DATE) RETURNING id INTO new_order_id;
              IF new_order_id <> 10001 THEN
                RAISE EXCEPTION 'Неверный идентификатор нового заказа: %', new_order_id;
              END IF;
              INSERT INTO order_product (quantity, order_id, product_id)
                VALUES (2, new_order_id, 1);
              IF nextval(pg_get_serial_sequence('product', 'id')) <> 7 THEN
                RAISE EXCEPTION 'Неверный следующий идентификатор товара';
              END IF;
            END;
            $$;
            ROLLBACK;
            SQL

        - name: Login to Docker
          # Авторизация на Docker Hub:
          uses: docker/login-action@v4
          # При помощи with передаём в action параметры username и password:
          with:
            username: ${{ secrets.DOCKER_USER }}
            password: ${{ secrets.DOCKER_PASSWORD }}
            # Хорошо ли держать логин и пароль прямо в коде workflow?
            # Нет, это нехорошо. Хранить пароль надо в Secrets.

        - name: Push Backend to DockerHub
          # Одновременный билд и пуш образа в Docker Hub:
          uses: docker/build-push-action@v7
          with:
            # Параметр context: ./backend/ указывает, что нужный Dockerfile 
            # находится в ./backend/
            context: ./backend/
            # Параметр push: true указывает, что образ нужно не только собрать,
            # но и отправить на Docker Hub:
            push: true
            # В параметре tags задаётся название и тег для образа.
            # Для каждого пересобранного образа 
            # устанавливаем тег latest, чтобы потом
            # на сервере и в docker-compose.yml не указывать версию образа:
            tags: ${{ secrets.DOCKER_USER }}/sausage-backend:latest
            build-args: |
              VERSION=${{ github.sha }}

        - name: Push Frontend to DockerHub
          uses: docker/build-push-action@v7
          with:
            context: ./frontend/
            push: true
            tags: ${{ secrets.DOCKER_USER }}/sausage-frontend:latest

        - name: Push Backend-report to DockerHub
          uses: docker/build-push-action@v7
          with:
            context: ./backend-report/
            push: true
            tags: ${{ secrets.DOCKER_USER }}/sausage-backend-report:latest

  # Упаковываем helm-чарт и пушим его в Nexus
  add_helm_chart_to_nexus:
      name: Add Helm Chart To Nexus
      runs-on: ubuntu-latest
      needs: build_and_push_to_docker_hub

      steps:
      #### Опишите необходимые шаги
        - run: ":"

  # Деплоим приложения в кластер Kubernetes с помощью helm-чарт
  deploy_helm_chart_to_kubernetes:
      name: Deploy Helm Chart To Kubernetes
      runs-on: ubuntu-latest
      needs: add_helm_chart_to_nexus

      steps:
      #### Опишите необходимые шаги
        - run: ":"
